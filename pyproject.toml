[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wraithwall"
version = "0.2.0"
description = "Production deception-and-threat-intelligence platform"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Niffyhunt", email = "contact@wraithwall.online" }]
requires-python = ">=3.12"
dependencies = [
    "flask>=3,<4",
    "flask-sqlalchemy>=3,<4",
    "flask-bcrypt>=1,<2",
    "flask-limiter>=3,<4",
    "flask-talisman>=1,<2",
    "flask-wtf>=1,<2",
    "flask-cors>=4,<7",
    "gunicorn>=21,<24",
    "redis>=5,<6",
    "requests>=2,<3",
    "sqlalchemy>=2,<3",
    "apscheduler>=3,<4",
    "pyotp>=2,<3",
    "python-jose>=3,<4",
    "validators>=0.22",
    "bleach>=6,<7",
    "user-agents>=2,<3",
    "cryptography>=42",
    "argon2-cffi>=23",
    "bcrypt>=4,<5",
    "httpx>=0.27",
    "typer>=0.12,<1",
    "psycopg2-binary>=2.9,<3",
    # dml_engine validates deception markup with PyYAML and is registered by
    # create_app() — a hard requirement, not an optional extra.
    "pyyaml>=6,<7",
    # campaign_correlator scores sessions with numpy; the blueprint degrades
    # gracefully without it, but the platform ships it so an OSS install has
    # the full correlation surface rather than a silently skipped module.
    "numpy>=1.26,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "ruff"]
all = ["wraithwall[dev]"]

[project.scripts]
wraithwall = "wraithwall.cli:app"
wraithwall-sandbox = "sandbox_kit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wraithwall", "sandbox_kit"]

[tool.hatch.build.targets.wheel.shared-data]
# Deployment assets the launcher needs at runtime. A wheel cannot ship a
# `src/` directory or a compose file at the package root without polluting
# site-packages, so they install under <prefix>/share/wraithwall/ and
# sandbox_kit.assets resolves them from either layout (see assets.py).
"sandbox.sh" = "share/wraithwall/sandbox.sh"
"compose.sandbox.yml" = "share/wraithwall/compose.sandbox.yml"
"Dockerfile.sandbox" = "share/wraithwall/Dockerfile.sandbox"
"Dockerfile.seed" = "share/wraithwall/Dockerfile.seed"
"Dockerfile.egress" = "share/wraithwall/Dockerfile.egress"
"Dockerfile.detonate" = "share/wraithwall/Dockerfile.detonate"
"detonate_sandbox" = "share/wraithwall/detonate_sandbox"
"docs/sandbox" = "share/wraithwall/docs/sandbox"
"requirements.txt" = "share/wraithwall/requirements.txt"

[tool.hatch.build.targets.sdist]
# only-include REPLACES the default file selection; a bare `include` pattern
# like "tests" matches any nested tests/ dir (gitignore-style) and used to pull
# the whole monorepo — compiled binaries included — into the sdist.
only-include = [
    "src/wraithwall",
    "sandbox_kit",
    "detonate_sandbox",
    "docs/sandbox",
    "examples",
    "tests",
    "sandbox.sh",
    "compose.sandbox.yml",
    "Dockerfile.sandbox",
    "Dockerfile.seed",
    "Dockerfile.egress",
    "Dockerfile.detonate",
    "CHANGELOG.md",
    "README.md",
    "SECURITY.md",
    "CONTRIBUTING.md",
    "DEVELOPER_DOCUMENTATION_PLAN.md",
    "LICENSE",
    "requirements.txt",
    ".env.example",
    ".github/workflows/ci.yml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["docker", "examples", ".git", "packages"]