  <rect x="720" y="150" width="180" height="44" rx="4" fill="#0f1520" stroke="#3dff9a" stroke-width="1.5"/>
  <text x="810.0" y="166.0" fill="#e8edf5" font-family="ui-monospace,monospace" font-size="12" text-anchor="middle" font-weight="600">IP blocklist</text>
  <text x="810.0" y="186.0" fill="#7a8ba3" font-family="ui-monospace,monospace" font-size="9" text-anchor="middle">consumer</text>
  <line x1="260" y1="172" x2="720" y2="172" stroke="#00e5ff" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.85"/>
