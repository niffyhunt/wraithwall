<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-label="Event Flow">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2332" stroke-width="0.6" opacity="0.45"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#00e5ff" opacity="0.9"/>
    </marker>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#ff2d95"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="#080c14"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <rect x="0" y="0" width="1920" height="72" fill="#0a1018" opacity="0.92"/>
  <line x1="48" y1="72" x2="1872" y2="72" stroke="#2a3a52" stroke-width="1"/>
  <text x="56" y="38" fill="url(#titleGrad)" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="22" font-weight="700">Event Flow</text>
  <text x="56" y="58" fill="#7a8ba3" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" letter-spacing="1.2">173 catalogued events · producer → consumer DAG</text>
  <text x="1864" y="44" fill="#7a8ba3" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="10" text-anchor="end">WRAITHWALL · PHASE 8 CORPUS</text>
  <text x="1864" y="58" fill="#7a8ba3" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="9" text-anchor="end">event_graph.json</text>
<rect x="40" y="120" width="1840" height="90" rx="6" fill="#00e5ff" opacity="0.08" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.35"/>
  <text x="54" y="142" fill="#00e5ff" font-family="ui-monospace,monospace" font-size="11" font-weight="600" letter-spacing="1.5">UNKNOWN</text>
  <rect x="60" y="150" width="200" height="44" rx="4" fill="#0f1520" stroke="#00e5ff" stroke-width="1.5"/>
  <text x="160.0" y="166.0" fill="#e8edf5" font-family="ui-monospace,monospace" font-size="12" text-anchor="middle" font-weight="600">gateway.challenge_issued</text>
  <text x="160.0" y="186.0" fill="#7a8ba3" font-family="ui-monospace,monospace" font-size="9" text-anchor="middle">173 events</text>
  <rect x="320" y="150" width="180" height="44" rx="4" fill="#0f1520" stroke="#3dff9a" stroke-width="1.5"/>
  <text x="410.0" y="166.0" fill="#e8edf5" font-family="ui-monospace,monospace" font-size="12" text-anchor="middle" font-weight="600">Gateway verify</text>
  <text x="410.0" y="186.0" fill="#7a8ba3" font-family="ui-monospace,monospace" font-size="9" text-anchor="middle">consumer</text>
  <line x1="260" y1="172" x2="320" y2="172" stroke="#00e5ff" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.85"/>
  <rect x="520" y="150" width="180" height="44" rx="4" fill="#0f1520" stroke="#3dff9a" stroke-width="1.5"/>
