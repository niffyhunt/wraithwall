  <text x="56" y="1052" fill="#7a8ba3" font-family="ui-monospace,monospace" font-size="10">Edges derived from event consumers[] — no synthetic events</text>
  <text x="1864" y="1052" fill="#7a8ba3" font-family="ui-monospace,monospace" font-size="10" text-anchor="end">Validated architecture · No inferred components</text>
